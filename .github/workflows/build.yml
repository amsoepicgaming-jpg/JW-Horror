name: Build JW Horror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-14
            label: macOS-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - uses: actions/upload-artifact@v4
        with:
          name: JW-Horror-${{ matrix.label }}
          path: |
            build/JWHorror_artefacts/Release/VST3/**
            build/JWHorror_artefacts/Release/AU/**
            build/JWHorror_artefacts/Release/Standalone/**
          if-no-files-found: error
