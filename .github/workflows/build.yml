name: Build JW Horror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
          - os: macos-14
            label: macOS-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Package complete Windows VST3 bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "build/JWHorror_artefacts/Release"
          $bundle = Get-ChildItem -Path "$root/VST3" -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Missing VST3 bundle" }
          $binary = Get-ChildItem -Path $bundle.FullName -Recurse -File -Filter "*.vst3" | Select-Object -First 1
          if (-not $binary) { throw "Missing x64 VST3 binary in bundle" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination dist -Recurse
          $exe = Get-ChildItem -Path "$root/Standalone" -Filter "*.exe" | Select-Object -First 1
          if ($exe) { Copy-Item -LiteralPath $exe.FullName -Destination dist }
          Compress-Archive -Path "dist/*" -DestinationPath "JW-Horror-Windows-x64.zip" -Force
      - name: Package complete macOS plugins
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="build/JWHorror_artefacts/Release"
          mkdir -p dist
          find "$root/VST3" -maxdepth 1 -name '*.vst3' -exec cp -R {} dist/ \;
          find "$root/AU" -maxdepth 1 -name '*.component' -exec cp -R {} dist/ \;
          find "$root/Standalone" -maxdepth 1 -name '*.app' -exec cp -R {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.vst3' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent dist JW-Horror-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JW-Horror-${{ matrix.label }}
          path: JW-Horror-${{ matrix.label }}.zip
          if-no-files-found: error
